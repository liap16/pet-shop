<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>寵物嚴選商城 - 管理後台</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff5f5; }
        .admin-content { display: none; } /* 預設隱藏 */
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2>管理員登入</h2>
        <input type="password" id="admin-pass" placeholder="請輸入密碼">
        <button onclick="checkLogin()">進入後台</button>
    </div>

    <div class="admin-content" id="admin-content">
        <h1>🎀 管理後台 🎀</h1>
        <button onclick="logout()">登出</button>

        <div class="section">
            <h3>📈 即時模擬銷量排行</h3>
            <ul id="admin-sales-rank"></ul>
        </div>

        <div class="section">
            <h3>👤 最新消費者訂單</h3>
            <table>
                <thead>
                    <tr><th>訂單編號</th><th>時間</th><th>商品</th><th>操作</th></tr>
                </thead>
                <tbody id="admin-feedbacks-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 核心檢查函式
        function checkLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "pet5") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                location.reload();
            } else {
                alert("密碼錯誤");
            }
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        // 初始化顯示
        window.onload = function() {
            if(localStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderDashboard();
            }
        };

        function renderDashboard() {
            const records = JSON.parse(localStorage.getItem('adminRecords') || '[]');
            const tableBody = document.getElementById('admin-feedbacks-table');
            
            if (records.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4">尚無訂單</td></tr>';
                return;
            }

            tableBody.innerHTML = records.map((r, i) => `
                <tr>
                    <td>${r.orderId || '-'}</td>
                    <td>${r.time || '-'}</td>
                    <td>${r.items || '-'}</td>
                    <td><button onclick="deleteRow(${i})">刪除</button></td>
                </tr>
            `).join('');
        }

        function deleteRow(index) {
            let records = JSON.parse(localStorage.getItem('adminRecords') || '[]');
            records.splice(index, 1);
            localStorage.setItem('adminRecords', JSON.stringify(records));
            renderDashboard();
        }
    </script>
</body>
</html>
