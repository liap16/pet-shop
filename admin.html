<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物嚴選商城 - 核心控制後台</title>
    <style>
        :root { --primary-pink: #ff9aa2; --bg-pink: #fff5f5; --white: #ffffff; --text-dark: #6d5959; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', sans-serif; }
        body { background-color: var(--bg-pink); color: var(--text-dark); padding: 20px; line-height: 1.6; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pink); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-card { background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ffe3e3; border-radius: 10px; }
        .login-card button { width: 100%; padding: 12px; background: var(--primary-pink); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .admin-content { display: none; max-width: 1100px; margin: 0 auto; }
        .header-banner { background: linear-gradient(135deg, #ff9aa2 0%, #ffb7b2 100%); color: white; text-align: center; padding: 30px; border-radius: 20px; margin-bottom: 25px; }
        .admin-section { background: var(--white); border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h3 { margin-bottom: 15px; border-left: 5px solid var(--primary-pink); padding-left: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #fff0f1; padding: 12px; border: 1px solid #ffe3e3; text-align: left; font-size: 0.9rem; }
        td { padding: 12px; border: 1px solid #ffe3e3; font-size: 0.9rem; }
        
        .btn-action-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn-action { padding: 12px 25px; border-radius: 25px; border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>管理員登入</h2>
            <input type="password" id="admin-pass" placeholder="請輸入管理密碼">
            <button onclick="checkLogin()">進入後台</button>
        </div>
    </div>

    <div class="admin-content" id="admin-content">
        <header class="header-banner">
            <h1>🎀 寵物嚴選商城 管理後台 🎀</h1>
        </header>

        <section class="admin-section">
            <h3>📈 即時模擬銷量排行</h3>
            <ul id="admin-sales-rank" style="list-style:none; padding-left: 10px;"></ul>
        </section>

        <section class="admin-section">
            <h3>👤 最新消費者訂單</h3>
            <table id="order-table">
                <thead><tr><th>訂單編號</th><th>時間</th><th>姓名</th><th>電話</th><th>取貨門市</th><th>商品</th><th>滿意度</th></tr></thead>
                <tbody id="admin-feedbacks-table"></tbody>
            </table>
            <div class="btn-action-group">
                <button class="btn-action" style="background:#4ecdc4" onclick="exportToExcel()">📊 匯出訂單</button>
                <button class="btn-action" style="background:#ff6b6b" onclick="clearData()">重設所有數據</button>
            </div>
        </section>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwn7t2h8lnbTC-pmzp85jHFzYqY9NRHveRKHd7boIVyyQiIrmmRGatbPmnMJo1sG9_mJQ/exec";

        function checkLogin() {
            if (document.getElementById('admin-pass').value === "pet5") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                location.reload();
            } else { alert("❌ 密碼錯誤！"); }
        }

        async function refreshDashboard() {
            try {
                // 讀取包含 orders 和 products 的完整資料包
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                const orders = data.orders; // 抓取訂單陣列
                
                // 統計銷量
                const stats = {
                    '智能自動定時餵食機': 0, 
                    '有機天然貓草深層紓壓罐頭': 0, 
                    '人體工學舒脊寵物保暖減壓床': 0
                };
                
                orders.forEach(order => {
                    const items = order.items || "";
                    for (let key in stats) {
                        if (items.includes(key)) {
                            stats[key] += 1;
                        }
                    }
                });

                document.getElementById('admin-sales-rank').innerHTML = Object.entries(stats)
                    .map(([n, c]) => `<li>${n}: <strong>${c} 件</strong></li>`).join('');

                // 顯示訂單表格
                const tableBody = document.getElementById('admin-feedbacks-table');
                if (orders.length > 0) {
                    tableBody.innerHTML = orders.map((o) => `
                        <tr>
                            <td>${o.orderId || '-'}</td>
                            <td>${o.time || '-'}</td>
                            <td>${o.name || '-'}</td>
                            <td>${o.phone || '-'}</td>
                            <td>${o.store || '-'}</td>
                            <td>${o.items || '-'}</td>
                            <td>${o.rating || 0} 星</td>
                        </tr>`).join('');
                } else {
                    tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">目前無訂單資料</td></tr>';
                }
            } catch (error) {
                console.error("同步失敗:", error);
                document.getElementById('admin-feedbacks-table').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">無法讀取資料。</td></tr>';
            }
        }

        function exportToExcel() { alert("請直接下載 Google Sheet 檔案進行匯出。"); }
        function clearData() { alert("請至 Google Sheet 清空訂單分頁。"); }

        if(localStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            refreshDashboard();
        }
    </script>
</body>
</html>
