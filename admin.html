<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物嚴選商城 - 管理後台</title>
    <style>
        :root { --primary-pink: #ff9aa2; --bg-pink: #fff5f5; }
        body { background-color: var(--bg-pink); font-family: sans-serif; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pink); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-card { background: white; padding: 40px; border-radius: 25px; text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ffe3e3; border-radius: 10px; }
        .login-card button { width: 100%; padding: 12px; background: var(--primary-pink); color: white; border: none; border-radius: 10px; cursor: pointer; }
        .admin-content { display: none; padding: 20px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>管理員登入</h2>
            <input type="password" id="admin-pass" placeholder="請輸入管理密碼">
            <button onclick="checkLogin()">進入後台</button>
        </div>
    </div>

    <div class="admin-content" id="admin-content">
        <h1>🎀 管理後台已開啟 🎀</h1>
        <button onclick="logout()">登出</button>
    </div>

    <script>
        function checkLogin() {
            const inputVal = document.getElementById('admin-pass').value;
            console.log("輸入的密碼為:", inputVal); // 若無法執行，請查看 F12 主控台
            
            if (inputVal === "pet5") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                alert("登入成功！");
                location.reload(); 
            } else {
                alert("❌ 密碼錯誤，請重新輸入。您輸入的是: " + inputVal);
            }
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        // 檢查登入狀態
        if(localStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
        }
    </script>
</body>
</html>
