<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>寵物嚴選商城 - 管理後台</title>
    <style>
        body { background-color: #fff5f5; font-family: sans-serif; padding: 20px; }
        .admin-content { display: none; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2>管理員登入</h2>
        <input type="password" id="admin-pass" placeholder="請輸入密碼">
        <button onclick="checkLogin()">進入後台</button>
    </div>

    <div class="admin-content" id="admin-content">
        <h1>🎀 管理後台已開啟 🎀</h1>
        <button onclick="logout()">登出</button>

        <div class="section">
            <h3>📈 即時模擬銷量排行</h3>
            <ul id="admin-sales-rank"></ul>
        </div>

        <div class="section">
            <h3>👤 最新消費者訂單</h3>
            <table>
                <thead>
                    <tr><th>訂單編號</th><th>時間</th><th>商品</th><th>操作</th></tr>
                </thead>
                <tbody id="admin-feedbacks-table"></tbody>
            </table>
        </div>
        <button onclick="clearData()">清空所有數據</button>
    </div>

    <script>
        function checkLogin() {
            if (document.getElementById('admin-pass').value === "pet5") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                location.reload();
            } else {
                alert("密碼錯誤");
            }
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        function clearData() {
            localStorage.removeItem('adminRecords');
            location.reload();
        }

        // 頁面載入時檢查狀態並渲染
        window.onload = function() {
            if(localStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                
                // 渲染邏輯
                const records = JSON.parse(localStorage.getItem('adminRecords') || '[]');
                const tableBody = document.getElementById('admin-feedbacks-table');
                tableBody.innerHTML = records.map((r, i) => `
                    <tr>
                        <td>${r.orderId || '-'}</td>
                        <td>${r.time || '-'}</td>
                        <td>${r.items || '-'}</td>
                        <td><button onclick="deleteRow(${i})">刪除</button></td>
                    </tr>
                `).join('');
            }
        };

        function deleteRow(index) {
            let records = JSON.parse(localStorage.getItem('adminRecords') || '[]');
            records.splice(index, 1);
            localStorage.setItem('adminRecords', JSON.stringify(records));
            location.reload();
        }
    </script>
</body>
</html>
